[project]
name = "lanes"
version = "0.1.0"
description = "Route work to the lane whose proof can close it, and judge it with a script any agent can run."
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.scripts]
rl = "lanes.cli:entry"

[tool.uv]
dev-dependencies = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
