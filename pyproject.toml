[project]
name = "lanes"
version = "0.2.0"
description = "agent-spec skills: route any work to the lane whose proof can close it."
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false
dev-dependencies = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["skills/agent-spec-lean"]
